name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod-IN'
        type: choice
        options:
        - prod-IN
        - prod-NL
      cleanup:
        description: 'Clean up persistent directories before deploying'
        required: false
        type: boolean
        default: false

  push:
      branches: [ main, master ]
      paths-ignore:
        - '.gitignore'
        - 'README.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment  || 'prod-IN' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files to temporary directory on VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: ".,!.git*,!.github*,!.gitignore,!.env,!.env.doppler"
          target: "/tmp/wgpihole-deploy-temp/"
          strip_components: 1
          overwrite: true

      - name: Cleanup (if needed), move files, and finalize deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            TARGET_DIR="/docker/wgpihole"
            TEMP_DIR="/tmp/wgpihole-deploy-temp"

            # Ensure target exists
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            export DOPPLER_TOKEN="${{ secrets.DOPPLER_TOKEN }}"

            # Optional cleanup: wipe everything before deploy
            if [ "${{ inputs.cleanup }}" = "true" ]; then
              echo "🧹 Cleaning up persistent directories..."
              find . -mindepth 1 -delete
            fi

            # Move files from temp to target (fast, atomic-ish)
            echo "🚚 Moving new files to $TARGET_DIR..."
            rsync -av --no-perms --no-owner --no-group "$TEMP_DIR"/. ./

            # Clean up temp directory
            rm -rf "$TEMP_DIR"

            # Remove any local env files from the target host
            rm -f .env .env.doppler

            # Install Doppler CLI if needed
            if ! command -v doppler >/dev/null 2>&1; then
              echo "⬇️ Installing Doppler CLI..."
              curl -sL https://cli.doppler.com/install.sh | sh
            fi

            # Validate Doppler secrets and run compose with them directly
            echo "🔐 Validating Doppler secrets..."
            if ! doppler run -- sh -lc 'test -n "$PIHOLE_WEBPASSWORD" && test -n "$WGEASY_PASSWORD_HASH" && test -n "$WG_HOST"'; then
              echo "❌ Required Doppler secrets are missing or empty"
              exit 1
            fi
            echo "✅ Doppler secrets validated"

            # Restart services using Doppler-injected environment
            echo "🚀 Restarting services..."
            doppler run -- docker compose down || true
            doppler run -- docker compose up -d

            sleep 10
            if ! doppler run -- docker compose ps | grep -q "Up"; then
              echo "❌ Services failed to start!"
              doppler run -- docker compose logs
              exit 1
            fi
            echo "✅ Services running"

            # Set Pi-hole password using Doppler secret
            for i in {1..15}; do
              if doppler run -- docker compose exec pihole pihole setpassword "$PIHOLE_WEBPASSWORD" > /dev/null 2>&1; then
                echo "✅ Pi-hole password set successfully"
                break
              fi
              echo "Attempt $i/15: waiting for Pi-hole..."
              sleep 10
            done || {
              echo "❌ Failed to set password after retries"
              exit 1
            }

            echo "🎉 Deployment completed successfully!"
